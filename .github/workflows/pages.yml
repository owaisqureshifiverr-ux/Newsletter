name: Deploy Company Newsletter to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-text-sizing
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate both routes and inline JavaScript
        run: node scripts/validate-pages.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published employee and HR pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local route="$1"
            local expected_marker="$2"
            local url="${PAGE_URL%/}/${route}"
            local body_file
            body_file="$(mktemp)"
            for attempt in {1..12}; do
              status="$(curl --silent --show-error --location --max-time 20 --output "$body_file" --write-out "%{http_code}" "$url" || true)"
              if [ "$status" = "200" ] && grep -qi "Company Newsletter" "$body_file" && grep -Fqi "$expected_marker" "$body_file"; then
                echo "PASS: $url returned HTTP 200 with Company Newsletter and survey marker $expected_marker."
                rm -f "$body_file"
                return 0
              fi
              echo "Attempt $attempt: $url returned HTTP ${status:-unknown}; retrying."
              sleep 5
            done
            echo "FAIL: $url did not return the expected Company Newsletter page."
            echo "Response preview:"
            head -c 1200 "$body_file" || true
            rm -f "$body_file"
            return 1
          }
          verify_page "" 'id="surveyRespondentName"'
          verify_page "hr/" 'id="surveyReportSelect"'
